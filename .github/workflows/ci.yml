name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install SDL2 and GL for the host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo xtask check

  package:
    name: stable ipk (armv7) + verify
    # The webosbrew NDK is published for macOS and linux-aarch64 only.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/webos-ndk
          key: webos-ndk-${{ runner.arch }}-${{ hashFiles('xtask/src/ndk.rs') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/ffmpeg
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('xtask/src/ffmpeg.rs', 'xtask/src/ndk.rs') }}
      - run: cargo xtask setup
      - run: cargo xtask ffmpeg
      - run: cargo xtask release
      - run: cargo xtask verify target/release-assets/*.ipk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      # Never a draft or prerelease: the Homebrew Channel reads releases/latest/download/.
      # The notes are the annotated tag's message.
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag assets/*
        env:
          GH_TOKEN: ${{ github.token }}
