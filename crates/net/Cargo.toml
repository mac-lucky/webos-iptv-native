[package]
name = "tv_net"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WebosIptv net layer: the two transports, libcurl HTTPS (bound at run time, nothing linked) and the plaintext socket stream."
repository = "https://github.com/mac-lucky/webos-iptv-native"
publish = false

[lib]
name = "tv_net"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too). It owns no
# build script and links nothing: libcurl is dlopen'd through `tv_base::dynlib!`, and the final
# link line stays the application crate's and the Makefile's (`LIBS_REAL`).
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets them. Each is named here
# only because some code in this crate (or in `tv_base`, which it forwards to) has a `cfg` on it
# (`net::post_pinned`, the `nowan` dev trigger).
devtriggers = ["tv_base/devtriggers"]
lab-diagnostics = ["tv_base/lab-diagnostics"]
# The `cfg(test)` seams other crates' tests use (`net::roots`'s and `net::resolve`'s test hooks,
# the loopback server fixtures, the canned-response helpers) plus the test-only CA-bundle override of
# `net::request_result`. The fixtures mint certificates and run a TLS server, so this feature is
# also what pulls in `rcgen`, `rustls` and `serde_json` (the HTTP/2 reset fixture reads its startup line). Enabled from the dependents' `[dev-dependencies]`; never
# in a shipped build.
test-support = ["tv_base/test-support", "dep:rcgen", "dep:rustls", "dep:serde_json"]

[dependencies]
tv_base = { path = "../base" }
libc = "0.2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
rcgen = { version = "0.14.10", optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"], optional = true }
rustls = { version = "0.23.45", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tv_base = { path = "../base", features = ["test-support"] }
rcgen = "0.14.10"
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
